.shrink { display:flex; width:180px; height:20px; }

.wrap { display:flex; flex-wrap:wrap; width:130px; height:50px; gap:10px; align-items:flex-start; }
.wrap div { flex-basis:60px; height:20px; }
.column { display:flex; flex-direction:column; width:40px; height:100px; gap:10px; }
.column div { flex-basis:20px; flex-grow:1; }

<div class="row"><div id="r1"></div><div id="r2"></div><div id="r3"></div></div>
<div class="shrink"><div id="s1"></div><div id="s2"></div><div id="s3"></div></div>
