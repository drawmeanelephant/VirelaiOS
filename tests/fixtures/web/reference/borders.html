<html><head><title>Border properties</title><style>
.all { border:2px solid #123456; padding:8px; }
.sides { color:green; border-width:1px 2px 3px 4px; border-style:solid; border-color:currentColor; }
.individual { border-top:3px solid red; border-right-width:4px; border-right-style:solid; border-right-color:blue; border-bottom-style:none; border-left:1px solid transparent; }
.off { border:none; }
</style></head><body><p class="all">Four solid edges.</p><p class="sides">Current foreground borders.</p><p class="individual">Independent sides.</p><p class="off">No border.</p></body></html>
