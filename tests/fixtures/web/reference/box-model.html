<html><head><title>Box properties</title><style>
body { margin:0; padding:12px; }
.box { width:50%; min-width:120px; max-width:600px; height:auto; min-height:32px; max-height:120px; margin:8px auto; padding:4px 8px 12px 16px; }
.fixed { width:200px; height:32px; margin-left:-4px; padding-top:2%; padding-right:2%; padding-bottom:0; padding-left:0; }
.initial { width:initial; height:initial; margin:initial; padding:initial; }
</style></head><body><div class="box">Content box with centered auto margins.</div><div class="fixed">Percent padding uses containing width.</div><div class="initial">Initial values.</div></body></html>
